apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - chart: argo-cd
      repoURL: https://argoproj.github.io/argo-helm
      targetRevision: 6.7.11 # Replace with your desired ArgoCD Helm chart version
      helm:
        valueFiles:
          - $values/argocd/argocd-values.yaml
    - repoURL: https://github.com/EvanLei-git/git-ops-setup.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
