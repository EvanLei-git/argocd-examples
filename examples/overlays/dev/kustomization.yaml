apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


resources:
- ../../base
- namespace.yaml

namePrefix: dev-

# Sets the namespace for all generated resources (probably need to change this)
namespace: dev-env


# SEPARATE NAMESPACES
patches:
- patch: |-
    - op: replace
      path: /spec/destination/namespace
      value: dev-env
  target:
    kind: Application
    name: postgres-bitnami


images:
- name: nginx
  newName: nginx
  newTag: 1.26.0
