apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


resources:
- ../../base
- namespace.yaml

namePrefix: dev-

# We CANNOT use the global `namespace: dev-env` because Kustomize applies it AFTER patches,
# which breaks the postgres Application object by forcing it out of the argocd namespace.
# Instead, we manually patch the NGINX components to go to dev-env.

# Patch NGINX Deployment and Service to go to dev-env

# Patch Postgres Application destination to dev-env, but keep the Application itself in argocd
# We also control the PostgreSQL Helm chart version right here in the overlay!
#The JSON Patch

# Merge Patch 
patches:
- patch: |-
    - op: replace
      path: /metadata/namespace
      value: dev-env
  target:
    kind: Deployment|Service
    name: nginx-.*
- patch: |-
    - op: replace
      path: /spec/destination/namespace
      value: dev-env
    - op: replace
      path: /metadata/namespace
      value: argocd
    - op: replace
      path: /spec/source/targetRevision
      value: 18.5.24
  target:
    kind: Application
    name: postgres-bitnami
- patch: |-
    - op: add
      path: /metadata/namespace
      value: dev-env
  target:
    kind: CronJob
    name: health-check-5-minutes
- patch: |-
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: health-check-5-minutes
    spec:
      jobTemplate:
        spec:
          template:
            spec:
              containers:
              - name: health-check-5-minutes
                env:
                - name: SERVICE_NAME
                  value: dev-nginx-nodeport
  target:
    kind: CronJob
    name: health-check-5-minutes


images:
- name: nginx
  newName: nginx
  newTag: 1.29.0



commonLabels:
  build-version: testbuild-v0.0.6
