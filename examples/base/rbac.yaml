---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-checker
  namespace: dev-env
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-checker-role
  namespace: dev-env
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-checker-binding
  namespace: dev-env
subjects:
- kind: ServiceAccount
  name: deployment-checker
  namespace: dev-env
roleRef:
  kind: Role
  name: deployment-checker-role
  apiGroup: rbac.authorization.k8s.io