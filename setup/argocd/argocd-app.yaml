apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-dev-env
  namespace: argocd
spec:
  project: default
  source:
    # Pointing exactly to your repo!
    repoURL: 'https://github.com/EvanLei-git/argocd-examples.git'
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev-env
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true