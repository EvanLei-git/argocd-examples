apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


resources:
- ../../base
- namespace.yaml

namePrefix: dev-

# With the postgres ArgoCD Application removed from base, we can now safely
# use the global namespace transformer — it applies to all resources.
namespace: dev-env

# Patch the CronJob env var to reference the prefixed deployment name.
# Kustomize namePrefix renames resources but doesn't update arbitrary env values.
patches:
- patch: |-
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: health-check-5-minutes
    spec:
      jobTemplate:
        spec:
          template:
            spec:
              containers:
              - name: health-check-5-minutes
                env:
                - name: DEPLOYMENT_NAME
                  value: dev-nginx-deployment
  target:
    kind: CronJob
    name: health-check-5-minutes

images:
- name: nginx
  newName: nginx
  newTag: 1.29.0

labels:
- pairs:
    build-version: testbuild-v0.0.11
