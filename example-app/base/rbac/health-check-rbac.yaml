# RBAC for the CronJob health checker.
# Grants read-only access to Deployments so the CronJob can check replica status.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-checker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-checker-role
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-checker-binding
subjects:
- kind: ServiceAccount
  name: deployment-checker
roleRef:
  kind: Role
  name: deployment-checker-role
  apiGroup: rbac.authorization.k8s.io
