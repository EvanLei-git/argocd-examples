# Headless Service required by the StatefulSet's serviceName field.
# Provides stable DNS: postgres-0.postgres.<namespace>.svc.cluster.local
# Apps can also connect via: postgres.<namespace>.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
