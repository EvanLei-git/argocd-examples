apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wordpress
namePrefix: prod-
resources:
  - ../../base/wordpress
  - wordpress-config.yaml

patches:
  - target:
      kind: Service
      name: wordpress-service
    patch: |-
      - op: add
        path: /spec/ports/0/nodePort
        value: 30082
  - target:
      kind: PersistentVolumeClaim
      name: wordpress-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: "5Gi"
