{{- $fullName := include "norbloc-helm.fullname" . -}}
{{- $ns := .Values.namespace | default .Release.Namespace -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-mariadb-init
  namespace: {{ $ns }}
  labels:
    {{- include "norbloc-helm.labels" . | nindent 4 }}
data:
  00-create-databases.sql: |-
    -- Auto-generated by norbloc-helm — do not edit manually
    {{- range $envName, $envConfig := .Values.environments }}
    CREATE DATABASE IF NOT EXISTS `{{ $envConfig.database }}`;
    GRANT ALL PRIVILEGES ON `{{ $envConfig.database }}`.* TO '{{ $.Values.mariadb.auth.user }}'@'%';
    {{- end }}
    FLUSH PRIVILEGES;
