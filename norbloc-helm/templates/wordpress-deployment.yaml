{{- $fullName := include "norbloc-helm.fullname" . -}}
{{- $ns := .Values.namespace | default .Release.Namespace -}}
{{- $mariadbHost := printf "%s-mariadb" $fullName -}}
{{- range $envName, $envConfig := .Values.environments }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-{{ $envName }}-wordpress
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/component: wordpress
    app.kubernetes.io/environment: {{ $envName }}
    {{- include "norbloc-helm.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: wordpress
      app.kubernetes.io/environment: {{ $envName }}
      {{- include "norbloc-helm.selectorLabels" $ | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: wordpress
        app.kubernetes.io/environment: {{ $envName }}
        {{- include "norbloc-helm.selectorLabels" $ | nindent 8 }}
    spec:
      initContainers:
      - name: wait-for-mariadb
        image: busybox:1.37
        command:
        - sh
        - -c
        - |
          until nc -z {{ $mariadbHost }} {{ $.Values.mariadb.service.port }}; do
            echo "Waiting for MariaDB at {{ $mariadbHost }}:{{ $.Values.mariadb.service.port }}..."
            sleep 3
          done
          echo "MariaDB is reachable — starting WordPress."
      containers:
      - name: wordpress
        image: "{{ $.Values.wordpress.image.repository }}:{{ $.Values.wordpress.image.tag }}"
        ports:
        - name: http
          containerPort: 80
        env:
        - name: WORDPRESS_DB_HOST
          value: "{{ $mariadbHost }}:{{ $.Values.mariadb.service.port }}"
        - name: WORDPRESS_DB_NAME
          value: {{ $envConfig.database | quote }}
        - name: WORDPRESS_DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ $fullName }}-mariadb-credentials
              key: MYSQL_USER
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $fullName }}-mariadb-credentials
              key: MYSQL_PASSWORD
        - name: WORDPRESS_TABLE_PREFIX
          value: {{ $.Values.wordpress.tablePrefix | quote }}
        - name: WORDPRESS_DEBUG
          value: {{ $.Values.wordpress.debug | quote }}
        readinessProbe:
          httpGet:
            path: /wp-login.php
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: wp-storage
          mountPath: /var/www/html/wp-content
      volumes:
      - name: wp-storage
        {{- if $.Values.wordpress.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ $fullName }}-{{ $envName }}-wordpress-pvc
        {{- else }}
        emptyDir: {}
        {{- end }}
{{- end }}
