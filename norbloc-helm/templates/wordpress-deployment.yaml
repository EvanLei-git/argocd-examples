apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "norbloc-helm.fullname" . }}-wordpress
  labels:
    app.kubernetes.io/component: wordpress
    {{- include "norbloc-helm.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: wordpress
      {{- include "norbloc-helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: wordpress
        {{- include "norbloc-helm.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: wordpress
        image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}"
        ports:
        - containerPort: 80
        env:
        - name: WORDPRESS_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "norbloc-helm.fullname" . }}-configmap
              key: WORDPRESS_DB_HOST
        - name: WORDPRESS_DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "norbloc-helm.fullname" . }}-mariadb-credentials
              key: MYSQL_USER
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "norbloc-helm.fullname" . }}-mariadb-credentials
              key: MYSQL_PASSWORD
        - name: WORDPRESS_TABLE_PREFIX
          value: {{ .Values.wordpress.tablePrefix | quote }}
        - name: WORDPRESS_DEBUG
          value: {{ .Values.wordpress.debug | quote }}
        volumeMounts:
        - name: wp-storage
          mountPath: /var/www/html/wp-content
      volumes:
      - name: wp-storage
        {{- if .Values.wordpress.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "norbloc-helm.fullname" . }}-wordpress-pvc
        {{- else }}
        emptyDir: {}
        {{- end }}
