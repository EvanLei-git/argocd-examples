apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "norbloc-helm.fullname" . }}-mariadb
  labels:
    app.kubernetes.io/component: mariadb
    {{- include "norbloc-helm.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: mariadb
      {{- include "norbloc-helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mariadb
        {{- include "norbloc-helm.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: mariadb
        image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "norbloc-helm.fullname" . }}-mariadb-credentials
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "norbloc-helm.fullname" . }}-mariadb-credentials
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "norbloc-helm.fullname" . }}-mariadb-credentials
              key: MYSQL_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: {{ include "norbloc-helm.fullname" . }}-configmap
              key: MYSQL_DATABASE
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: db-storage
        {{- if .Values.mariadb.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "norbloc-helm.fullname" . }}-mariadb-pvc
        {{- else }}
        emptyDir: {}
        {{- end }}
