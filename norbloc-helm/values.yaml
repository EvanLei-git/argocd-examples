# Default values for norbloc-helm

# MariaDB Configuration
mariadb:
  image:
    repository: mariadb
    tag: "11.8"
  service:
    type: ClusterIP
    port: 3306
  persistence:
    enabled: true
    # Leave empty to use cluster default. Set to "-" to disable dynamic provisioning.
    storageClass: ""
    size: 2Gi
    accessMode: ReadWriteOnce
  auth:
    # Base64-encoded password. Override per environment in envs/*.yaml
    rootPassword: "FOR-THE-KEY"
    # Database user for WordPress to connect with
    user: "wordpress"
    userPassword: "FOR-THE-KEY"
  database: "wordpress"

# WordPress Configuration
wordpress:
  image:
    repository: wordpress
    tag: "6.9.4-apache"
  service:
    type: ClusterIP
    port: 80
  persistence:
    enabled: true
    storageClass: ""
    size: 2Gi
    accessMode: ReadWriteOnce
  tablePrefix: "nrb_"
  debug: "0"

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  host: "norbloc.localhost"
