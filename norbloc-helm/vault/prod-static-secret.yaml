# Syncs secret/mariadb/production from Vault into the single shared MariaDB K8s Secret.
# With ONE shared MariaDB pod, there is only ONE credential secret.
# Both WordPress pods (wp-prod and wp-staging) reference this same secret —
# they are isolated by database name (wp-prod-db / wp-staging-db), not by credentials.
#
# Destination name = release-name (norbloc) + chart-name (norbloc-helm) + "-mariadb-credentials"
# VSO refreshes every 30s — Vault rotations are picked up automatically.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mariadb-prod-creds
  namespace: wordpress
spec:
  vaultAuthRef: norbloc-mariadb-auth
  mount: secret
  type: kv-v2
  path: mariadb/production
  refreshAfter: 30s
  destination:
    name: norbloc-norbloc-helm-mariadb-credentials
    create: true
    transformation:
      templates:
        MYSQL_ROOT_PASSWORD:
          text: '{{ .Secrets.rootPassword }}'
        MYSQL_PASSWORD:
          text: '{{ .Secrets.userPassword }}'
        MYSQL_USER:
          text: 'wordpress'
